<!DOCTYPE html>
<html lang="en">

<head>
    <title>WoMo auto-Kühlung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <style>
        .fan-control {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .fan-btn {
            min-width: 58px;
            padding: 10px 14px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>

</head>

<body>
    <!-- Navigation, Text kann als Version genutzt werden-->
    <div class="topnav">
        <h1>womoklg, V1.2</h1>
    </div>
    <div class="content">
        <!-- Connect/Disconnect buttons -->
        <div class="connection-card">
            <button id="connectBleButton" class="connectButton">&#x1F4F6;&nbsp; Connect to BLE device</button>
            <button id="disconnectBleButton" class="disconnectButton hidden">&#x274C;&nbsp; Disconnect</button>
            <div class="ble-status">
                <span class="ble-dot" id="bleDot"></span>
                <span id="bleState">Disconnected</span>
            </div>

        </div>
        <!-- Sensor Reading Cards -->
        <div class="sensor-grid">
            <div class="sensor-card temp">
                <!--                <span class="sensor-icon">&#x1F321;</span>
-->
                <div class="sensor-label">Temperatur Eingang</div>
                <div class="sensor-value">
                    <span id="tempEingValue">--</span><span class="sensor-unit">&nbsp;&deg;C</span>
                </div>
                <div class="sensor-timestamp" id="tempEingTimestamp">No reading</div>
            </div>

            <div class="sensor-card temp">
                <!--                <span class="sensor-icon">&#x1F321;</span> 
-->
                <div class="sensor-label">Temperatur Ausgang</div>
                <div class="sensor-value">
                    <span id="tempAusgValue">--</span><span class="sensor-unit">&nbsp;&deg;C</span>
                </div>
                <div class="sensor-timestamp" id="tempAusgTimestamp">No reading</div>
            </div>

            <div class="sensor-card write">
                <span class="sensor-icon">&#x1F4A8;</span>
                <div class="sensor-label"><span id="fanLabelText">Lüfter(off):</span> <span id="writeValue">0</span>
                </div>
                <div class="write-control fan-control">
                    <button class="fan-btn" id="fanOffButton">Aus</button>
                    <button class="fan-btn" id="fanMinButton">Min</button>
                    <button class="fan-btn fan-step" id="fanPlusButton">+</button>
                    <button class="fan-btn fan-step" id="fanMinusButton">-</button>
                </div>
                <div class="write-status" id="writeStatus">Bereit</div>
            </div>

            <div class="sensor-card write">
                <span class="sensor-icon">&#x1F4A1;</span>
                <div class="sensor-label">Schaltschwelle (4°): <span id="thresholdValue">60</span>&deg;C</div>
                <div class="write-control fan-control">
                    <button class="fan-btn" id="thresholdMinusButton">-2</button>
                    <button class="fan-btn" id="thresholdPlusButton">+2</button>
                </div>
                <div class="write-status" id="thresholdStatus">Bereit</div>
            </div>
        </div>
    </div>
    <!--
    <div class="footer">
        <p><a href="https://randomnerdtutorials.com/esp32-web-ble-sensor-visualization/" target="_blank">Created by
                RandomNerdTutorials.com - Read the Complete Project »</a></p>
    </div>
-->
    <script>
        // DOM Elements
        const connectButton = document.getElementById('connectBleButton');
        const disconnectButton = document.getElementById('disconnectBleButton');
        const bleStateEl = document.getElementById('bleState');
        const bleDot = document.getElementById('bleDot');

        const tempEingValueEl = document.getElementById('tempEingValue');
        const tempAusgValueEl = document.getElementById('tempAusgValue');
        const fanLabelText = document.getElementById('fanLabelText');
        const writeValueEl = document.getElementById('writeValue');
        const thresholdValueEl = document.getElementById('thresholdValue');
        const tempEingTimestamp = document.getElementById('tempEingTimestamp');
        const tempAusgTimestamp = document.getElementById('tempAusgTimestamp');

        // BLE UUIDs
        var deviceName = 'womoklg';
        var bleService = '12345678-1234-5678-1234-56789abcde00';
        var thresholdCharUUID = '12345678-1234-5678-1234-56789abcde05';

        // Minimal verified BLE layout: only the working service and threshold characteristic remain.
        const requiredCharUuids = [
            thresholdCharUUID
        ];

        // BLE state
        var bleServer;
        var thresholdCharFound;
        var userDisconnected = false;



        // Sensor state
        var currentFanOnValue = 123;
        var currentUpSchwelleValue = 60;

        function updateWriteValueDisplay(value) {
            currentFanOnValue = value;
            writeValueEl.textContent = value;
        }

        function updateThresholdValueDisplay(value) {
            currentUpSchwelleValue = value;
            thresholdValueEl.textContent = value;
        }

        function updateFanLabelDisplay(statusText) {
            const normalized = String(statusText || '').trim().toLowerCase();
            const isOn = normalized === 'on' || normalized === 'true' || normalized === '1';
            fanLabelText.textContent = isOn ? 'Lüfter (ON):' : 'Lüfter(off):';
        }

        // BLE UI helpers
        function showConnectButton() {
            connectButton.classList.remove('hidden');
            disconnectButton.classList.add('hidden');
        }

        function showDisconnectButton() {
            connectButton.classList.add('hidden');
            disconnectButton.classList.remove('hidden');
        }

        function setBleConnected(deviceName) {
            bleStateEl.textContent = 'Connected to ' + deviceName;
            bleDot.className = 'ble-dot connected';
            showDisconnectButton();
        }

        function setBleDisconnected(msg) {
            bleStateEl.textContent = msg || 'Disconnected';
            bleDot.className = 'ble-dot';
            showConnectButton();
        }

        function isWebBluetoothEnabled() {
            if (!navigator.bluetooth) {
                setBleDisconnected('Web Bluetooth not available in this browser');
                return false;
            }
            return true;
        }

        function normalizeUuid(uuid) {
            return String(uuid || '').toLowerCase().replace(/[^0-9a-f]/g, '');
        }

        function uuidMatches(candidateUuid, targetUuid) {
            const candidate = normalizeUuid(candidateUuid);
            const target = normalizeUuid(targetUuid);

            if (!candidate || !target) return false;
            if (candidate === target) return true;

            // Bluetooth 16-bit UUIDs are often exposed as 128-bit values with a common base prefix.
            if (candidate.endsWith(target)) return true;
            if (target.endsWith(candidate)) return true;

            // Fallback for 4-byte and 16-bit variants: compare the last 4 or 8 hex digits.
            if (candidate.length >= 4 && target.length >= 4 && candidate.endsWith(target.slice(-4))) return true;
            if (candidate.length >= 8 && target.length >= 8 && candidate.endsWith(target.slice(-8))) return true;

            return false;
        }

        async function findCharacteristicByUuid(service, uuid) {
            const candidates = await service.getCharacteristics();
            const match = candidates.find(characteristic => uuidMatches(characteristic.uuid, uuid));

            if (!match) {
                console.warn(`Characteristic ${uuid} not found. Available:`, candidates.map(c => c.uuid));
                throw new Error(`Characteristic ${uuid} not found`);
            }

            return match;
        }

        // Connect BLE handler
        async function connectToDevice() {
            userDisconnected = false;
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: deviceName }],
                    optionalServices: [bleService]
                });

                device.addEventListener('gattserverdisconnected', onDisconnected);
                const gattServer = await device.gatt.connect();

                bleServer = gattServer;
                setBleConnected(gattServer.device.name);

                const service = await gattServer.getPrimaryService(bleService);

                const requiredChars = await Promise.allSettled(
                    requiredCharUuids.map(uuid => subscribeChar(service, uuid, handleThresholdValue, char => {
                        if (uuid === thresholdCharUUID) {
                            thresholdCharFound = char;
                        }
                    }))
                );

                requiredChars.forEach((result, index) => {
                    if (result.status === 'rejected') {
                        console.warn(`Required characteristic missing: ${requiredCharUuids[index]}`);
                    }
                });

            } catch (err) {
                console.error('Connection error:', err);
                setBleDisconnected('Connection failed: ' + err.message);
            }
        }

        async function subscribeChar(service, uuid, handler, storeFn) {
            try {
                const char = await findCharacteristicByUuid(service, uuid);
                storeFn(char);

                char.addEventListener('characteristicvaluechanged', handler);
                await char.startNotifications();

                try {
                    const val = await char.readValue();
                    await new Promise(resolve => setTimeout(resolve, 50));
                    handler({ target: { value: val } });
                } catch (readErr) {
                    console.warn('Initial read failed for', uuid, ':', readErr);
                }

                console.log(`Subscribed to ${uuid}`);
                return char;
            } catch (err) {
                console.warn('Could not subscribe to', uuid, ':', err);
                return null;
            }
        }

        // Characteristic handlers
        function decodeBleString(value) {
            if (!value) return '';
            return new TextDecoder().decode(value).trim();
        }

        function parsePayloadState(value) {
            const text = decodeBleString(value);
            if (!text) return null;

            const state = {};
            for (const part of text.split(';')) {
                const [key, ...rest] = part.split('=');
                if (!key || rest.length === 0) continue;
                state[key.trim()] = rest.join('=').trim();
            }
            return state;
        }

        function handleThresholdValue(event) {
            const state = parsePayloadState(event.target.value);
            if (!state) return;

            if (state.V !== undefined) {
                const value = Number.parseFloat(state.V);
                if (!Number.isNaN(value)) {
                    tempEingValueEl.textContent = value.toFixed(1);
                    tempEingTimestamp.textContent = 'Last reading: ' + getTime();
                }
            }

            if (state.N !== undefined) {
                const value = Number.parseFloat(state.N);
                if (!Number.isNaN(value)) {
                    tempAusgValueEl.textContent = value.toFixed(1);
                    tempAusgTimestamp.textContent = 'Last reading: ' + getTime();
                }
            }

            if (state.F !== undefined) {
                updateFanLabelDisplay(state.F);
            }

            if (state.D !== undefined) {
                const value = Number.parseInt(state.D, 10);
                if (!Number.isNaN(value)) {
                    updateWriteValueDisplay(value);
                }
            }

            if (state.T !== undefined) {
                const value = Number.parseInt(state.T, 10);
                if (!Number.isNaN(value)) {
                    updateThresholdValueDisplay(value);
                }
            }

            console.log('Updated BLE state payload:', state);
        }

        // Disconnect handlers
        function onDisconnected(event) {
            if (!userDisconnected) {
                setBleDisconnected('Device disconnected unexpectedly');
            }
        }

        function disconnectDevice() {
            if (!bleServer || !bleServer.connected) {
                alert('Bluetooth is not connected.');
                return;
            }
            userDisconnected = true;
            const stops = [];
            if (thresholdCharFound) stops.push(thresholdCharFound.stopNotifications().catch(() => { }));

            Promise.all(stops)
                .then(() => bleServer.disconnect())
                .then(() => setBleDisconnected('Disconnected'))
                .catch(err => console.error('Disconnect error:', err));
        }

        async function writeFanValue(value) {
            if (!bleServer || !bleServer.connected) {
                document.getElementById('writeStatus').textContent = 'Write characteristic nicht verfügbar. Bitte erneut verbinden.';
                return;
            }

            try {
                const service = await bleServer.getPrimaryService(bleService);
                thresholdCharFound = await findCharacteristicByUuid(service, thresholdCharUUID);
            } catch (err) {
                console.warn('Fan/threshold characteristic not found on demand:', err);
                document.getElementById('writeStatus').textContent = 'Write characteristic nicht verfügbar. Bitte erneut verbinden.';
                return;
            }

            value = parseInt(value, 10);
            if (isNaN(value)) return;

            try {
                const text = `SET|D=${Math.max(0, Math.min(159, value))}`;
                const bytes = new TextEncoder().encode(text);
                await thresholdCharFound.writeValue(bytes);
                updateWriteValueDisplay(value);
                document.getElementById('writeStatus').textContent = `Gesendet: ${value}`;
            } catch (err) {
                document.getElementById('writeStatus').textContent = `Fehler: ${err.message}`;
                console.error('Write error:', err);
            }
        }

        async function writeThresholdValue(value) {
            if (!bleServer || !bleServer.connected) {
                document.getElementById('thresholdStatus').textContent = 'Threshold-Characteristic nicht verfügbar. Bitte erneut verbinden.';
                return;
            }

            try {
                const service = await bleServer.getPrimaryService(bleService);
                thresholdCharFound = await findCharacteristicByUuid(service, thresholdCharUUID);
            } catch (err) {
                console.warn('Threshold characteristic not found on demand:', err);
                document.getElementById('thresholdStatus').textContent = 'Threshold-Characteristic nicht verfügbar. Bitte erneut verbinden.';
                return;
            }

            value = parseInt(value, 10);
            if (isNaN(value)) return;

            value = Math.max(0, Math.min(100, value));

            try {
                const text = `SET|T=${value}`;
                const bytes = new TextEncoder().encode(text);
                await thresholdCharFound.writeValue(bytes);
                updateThresholdValueDisplay(value);
                document.getElementById('thresholdStatus').textContent = `Gesendet: ${value}`;
            } catch (err) {
                document.getElementById('thresholdStatus').textContent = `Fehler: ${err.message}`;
                console.error('Threshold write error:', err);
            }
        }

        function setFanOff() {
            writeFanValue(0);
        }

        function setFanMin() {
            writeFanValue(100);
        }

        function increaseFan() {
            writeFanValue(Math.min(currentFanOnValue + 10, 159));
        }

        function decreaseFan() {
            writeFanValue(Math.max(currentFanOnValue - 10, 0));
        }

        function increaseThreshold() {
            writeThresholdValue(currentUpSchwelleValue + 2);
        }

        function decreaseThreshold() {
            writeThresholdValue(currentUpSchwelleValue - 2);
        }

        function getTime() {
            var d = new Date();
            var p = n => ('00' + n).slice(-2);
            return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }

        updateWriteValueDisplay(currentFanOnValue);
        updateThresholdValueDisplay(currentUpSchwelleValue);
        updateFanLabelDisplay('off');

        // Button listeners
        connectButton.addEventListener('click', () => {
            if (isWebBluetoothEnabled()) connectToDevice();
        });
        disconnectButton.addEventListener('click', disconnectDevice);
        document.getElementById('fanOffButton').addEventListener('click', setFanOff);
        document.getElementById('fanMinButton').addEventListener('click', setFanMin);
        document.getElementById('fanPlusButton').addEventListener('click', increaseFan);
        document.getElementById('fanMinusButton').addEventListener('click', decreaseFan);
        document.getElementById('thresholdMinusButton').addEventListener('click', decreaseThreshold);
        document.getElementById('thresholdPlusButton').addEventListener('click', increaseThreshold);
    </script>
</body>

</html>
